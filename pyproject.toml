[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marstotable_biosim"
version = "0.1.0"
description = "Mars to Table simulation and BioSim integration"
requires-python = ">=3.9"
dependencies = [
  "pandas",
  "numpy"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
